name: Independent worker checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test tests
      # The root build command packages the complete desktop runtime. Package
      # builds belong to the manual packages job in windows-release.yml.
      - name: Build worker and pipeline
        run: cargo build --release --locked --workspace
      - name: Check and build desktop frontend
        working-directory: desktop
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test tests
          bun run build
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci --prefix pipeline/docker/converter
      - run: python -m unittest discover -s pipeline/tests
      - run: docker build --target test -t worker-cpu-test .
        if: runner.os == 'Linux'
