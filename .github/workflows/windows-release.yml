name: Worker checks and desktop packages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: Build self-contained desktop packages (large CUDA dependencies on Windows/Linux)
        type: boolean
        default: false
      linux_package_runner:
        description: Linux package runner label (use a larger or dedicated self-hosted runner with 70 GiB free)
        type: string
        default: ubuntu-24.04
      windows_package_runner:
        description: Windows package runner label (use a larger or dedicated self-hosted runner with 70 GiB free)
        type: string
        default: windows-2022
      macos_package_runner:
        description: macOS package runner label (at least 12 GiB free for the smaller base runtime)
        type: string
        default: macos-15
permissions:
  contents: read
concurrency:
  group: worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - name: Parse Windows packaging scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parserTokens = $null
          $parserErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/build-windows.ps1'),
            [ref]$parserTokens, [ref]$parserErrors)
          if ($parserErrors.Count -gt 0) {
            $parserErrors | ForEach-Object { Write-Host $_.ToString() }
            throw 'Windows installer packaging script has PowerShell syntax errors.'
          }
          $crtModule = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-crt.ts') -Raw
          $embedded = [regex]::Match($crtModule, '(?s)const vendorScript = String\.raw`(.*?)`;')
          if (!$embedded.Success) { throw 'Cannot locate the embedded Windows CRT preparation script.' }
          $null = [System.Management.Automation.Language.Parser]::ParseInput(
            $embedded.Groups[1].Value, [ref]$parserTokens, [ref]$parserErrors)
          if ($parserErrors.Count -gt 0) {
            $parserErrors | ForEach-Object { Write-Host $_.ToString() }
            throw 'Windows CRT preparation has PowerShell syntax errors.'
          }
      - name: Check worker and integrations
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run check:python
          bun test tests
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --release --locked --workspace
          python -m pip install --require-hashes --only-binary=:all: -r packaging/python-base.txt
          npm ci --prefix pipeline/docker/converter
          PYTHONPATH=pipeline python -m unittest discover -s pipeline/tests
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Check desktop frontend
        working-directory: desktop
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test tests
          bun run build
      - name: Check Linux CPU image
        if: runner.os == 'Linux'
        run: docker build --target test -t guerrilla-worker:test .
      - name: Check native Windows desktop and profile isolation
        if: runner.os == 'Windows'
        run: |
          cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
  packages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.packages
    needs: checks
    name: Desktop package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ${{ inputs.linux_package_runner || 'ubuntu-24.04' }}
          - platform: Windows
            runner: ${{ inputs.windows_package_runner || 'windows-2022' }}
          - platform: macOS
            runner: ${{ inputs.macos_package_runner || 'macos-15' }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Free Linux runner space for complete GPU runtimes
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          # Dedicated hosted runner only. None of these tools participates in
          # the Rust/Svelte/Python worker build; keep language/build toolchains.
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /opt/ghc /usr/local/.ghcup; do
            if [ -d "$directory" ]; then sudo rm -rf -- "$directory"; fi
          done
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Require capacity for complete runtime bundles and installer smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $minimumGiB = if ($env:RUNNER_OS -eq 'macOS') { 12 } else { 70 }
          $minimumBytes = $minimumGiB * 1GB
          $volumes = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) | ForEach-Object { [IO.Path]::GetPathRoot($_) } | Sort-Object -Unique
          foreach ($volume in $volumes) {
            $drive = [IO.DriveInfo]::new($volume)
            if ($drive.AvailableFreeSpace -lt $minimumBytes) {
              $available = [Math]::Round($drive.AvailableFreeSpace / 1GB, 1)
              throw "Complete $($env:RUNNER_OS) runtime packaging requires at least $minimumGiB GiB free on $volume; only $available GiB is available. Use a larger GitHub runner or a dedicated self-hosted runner with a larger disk. Dependencies are not trimmed to fit a small runner."
            }
          }
          $runtimeCache = Join-Path $env:RUNNER_TEMP 'guerrilla-build-cache'
          [IO.File]::AppendAllText($env:GITHUB_ENV, "WORKER_BUILD_CACHE=$runtimeCache`n", [Text.UTF8Encoding]::new($false))
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Build desktop with vendored dependencies
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Smoke test Windows installer without enrollment or worker launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This production installer test is runner-only. Fail closed if the
          # account has an existing worker/profile/login entry; /DIR alone does
          # not isolate the installer's normal profile and registry cleanup.
          $normalProfile = Join-Path $env:LOCALAPPDATA 'Guerrilla/worker'
          function Assert-FreshWorkerAccount {
            if (Test-Path -LiteralPath $normalProfile) { throw 'Installer smoke requires a fresh dedicated runner without a normal worker profile.' }
            if (@(Get-Process -Name 'guerrilla-worker-desktop', 'guerrilla-worker', 'guerrilla-pipeline' -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Existing worker processes prevent an isolated installer smoke test.' }
            $runKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion\Run')
            try {
              if ($null -ne $runKey) {
                foreach ($entry in @('GuerrillaWorker', 'guerrilla-worker-desktop')) {
                  if ($runKey.GetValueNames() -contains $entry) { throw 'Existing Guerrilla login registration prevents installer smoke testing.' }
                }
              }
            } finally { if ($null -ne $runKey) { $runKey.Dispose() } }
          }
          Assert-FreshWorkerAccount
          $installerFolder = Join-Path $env:GITHUB_WORKSPACE 'desktop/src-tauri/target/release/bundle/installer'
          $installers = @(Get-ChildItem -LiteralPath $installerFolder -Filter '*-windows-x64-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one generated Windows installer.' }
          $installer = $installers[0]
          if (@(Get-ChildItem -LiteralPath $installerFolder -Filter ($installer.BaseName + '-*.bin') -File).Count -eq 0) { throw 'Installer data slices are missing.' }
          $qaRoot = Join-Path $env:RUNNER_TEMP ('guerrilla-installer-' + [Guid]::NewGuid().ToString('N'))
          $installed = Join-Path $qaRoot 'app'
          $profileDirectory = Join-Path $qaRoot 'profile'
          $null = New-Item -ItemType Directory -Path $profileDirectory -Force
          $config = Join-Path $profileDirectory 'config.json'
          $scratch = Join-Path $profileDirectory 'scratch'
          $null = New-Item -ItemType Directory -Path $scratch -Force
          $sentinel = Join-Path $scratch 'retained-checkpoint.txt'
          [IO.File]::WriteAllText($sentinel, 'preserved-checkpoint', [Text.UTF8Encoding]::new($false))
          $installLog = Join-Path $qaRoot 'install.log'
          $uninstallLog = Join-Path $qaRoot 'uninstall.log'
          $trackedEnvironment = @('WORKER_CREDENTIAL_FILE', 'WORKER_PIPELINE_BIN', 'WORKER_RUNTIME_ROOT', 'WORKER_CRT_ROOT', 'PIPELINE_ROOT', 'WORKER_SCRATCH', 'LICHTFELD_BIN', 'SPIRULA_BIN')
          $previousEnvironment = @{}
          foreach ($name in $trackedEnvironment) { $previousEnvironment[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }
          $uninstaller = Join-Path $installed 'unins000.exe'
          $removed = $false
          try {
            $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installed`"", "/LOG=`"$installLog`"") -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "Installer failed ($($setup.ExitCode)); inspect $installLog" }
            $requiredFiles = @(
              'guerrilla-worker-desktop.exe', 'guerrilla-worker.exe', 'guerrilla-pipeline.exe',
              'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'LICENSE', 'README.md',
              'resources/runtime/manifest.json', 'resources/runtime/windows-crt/manifest.json',
              'resources/runtime/python/python.exe', 'resources/runtime/node/node.exe',
              'resources/runtime/ffmpeg/ffmpeg.exe', 'resources/runtime/ffmpeg/ffprobe.exe',
              'resources/runtime/converter/node_modules/@playcanvas/splat-transform/bin/cli.mjs',
              'resources/pipeline/native_bindings.py', 'resources/pipeline/scan-settings.schema.json'
            )
            foreach ($relative in $requiredFiles) {
              if (!(Test-Path -LiteralPath (Join-Path $installed $relative) -PathType Leaf)) { throw "Installed app is missing $relative" }
            }
            $runtime = Join-Path $installed 'resources/runtime'
            $pipeline = Join-Path $installed 'resources/pipeline'
            $profile = [ordered]@{
              controlUrl = 'https://example.invalid'; scratchDirectory = $scratch;
              pythonPath = (Join-Path $runtime 'python/python.exe'); nodePath = (Join-Path $runtime 'node/node.exe');
              ffmpegPath = (Join-Path $runtime 'ffmpeg/ffmpeg.exe');
              converterPath = (Join-Path $runtime 'converter/node_modules/@playcanvas/splat-transform/bin/cli.mjs');
              lichtfeldPath = (Join-Path $qaRoot 'not-installed/lichtfeld.exe');
              spirulaPath = (Join-Path $qaRoot 'not-installed/spirula.exe');
              densificationPluginPath = ''; startAtLogin = $false
            }
            [IO.File]::WriteAllText($config, ($profile | ConvertTo-Json -Depth 4), [Text.UTF8Encoding]::new($false))
            $configHash = (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash
            $env:WORKER_CREDENTIAL_FILE = Join-Path $profileDirectory 'credentials.json'
            $env:WORKER_PIPELINE_BIN = Join-Path $installed 'guerrilla-pipeline.exe'
            $env:WORKER_RUNTIME_ROOT = $runtime
            $env:WORKER_CRT_ROOT = Join-Path $runtime 'windows-crt'
            $env:PIPELINE_ROOT = $pipeline
            $env:WORKER_SCRATCH = $scratch
            $env:LICHTFELD_BIN = $profile.lichtfeldPath
            $env:SPIRULA_BIN = $profile.spirulaPath
            $worker = Join-Path $installed 'guerrilla-worker.exe'
            $statusOutput = & $worker --config $config status
            if ($LASTEXITCODE -ne 0) { throw 'Installed worker status command failed.' }
            $status = ($statusOutput -join "`n") | ConvertFrom-Json
            if ($status.state -ne 'unenrolled' -or $status.connected -or $status.running) { throw 'Fresh installed worker must be unenrolled, disconnected and stopped.' }
            $preflightOutput = & $worker --config $config preflight
            if ($LASTEXITCODE -ne 0) { throw 'Installed pipeline dependency report failed.' }
            $preflight = ($preflightOutput -join "`n") | ConvertFrom-Json
            foreach ($backend in @('lichtfeld', 'spirula')) {
              $capability = $preflight.backends.PSObject.Properties[$backend]
              if ($null -eq $capability -or $capability.Value.available) { throw 'Missing user-installed engines must remain unavailable.' }
            }
            if (Test-Path -LiteralPath $env:WORKER_CREDENTIAL_FILE) { throw 'Status/preflight unexpectedly created enrollment.' }
            Assert-FreshWorkerAccount
            $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$uninstallLog`"") -Wait -PassThru
            if ($remove.ExitCode -ne 0) { throw "Uninstall failed ($($remove.ExitCode)); inspect $uninstallLog" }
            $removed = $true
            # The uninstaller deletes its own executable through a short-lived
            # helper; allow it to finish before checking the removed files.
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            while ((Test-Path -LiteralPath (Join-Path $installed 'guerrilla-worker-desktop.exe')) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 250 }
            foreach ($relative in $requiredFiles) {
              if (Test-Path -LiteralPath (Join-Path $installed $relative)) { throw "Uninstall retained owned app file $relative" }
            }
            if (!(Test-Path -LiteralPath $config) -or (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash -ne $configHash) { throw 'Uninstall changed the isolated worker profile.' }
            if (!(Test-Path -LiteralPath $sentinel) -or [IO.File]::ReadAllText($sentinel) -ne 'preserved-checkpoint') { throw 'Uninstall removed the retained checkpoint.' }
            Assert-FreshWorkerAccount
          } finally {
            if (!$removed -and (Test-Path -LiteralPath $uninstaller)) {
              $cleanup = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$uninstallLog`"") -Wait -PassThru
              if ($cleanup.ExitCode -ne 0) { Write-Warning "Installer smoke cleanup failed ($($cleanup.ExitCode))." }
            }
            foreach ($name in $trackedEnvironment) { [Environment]::SetEnvironmentVariable($name, $previousEnvironment[$name], 'Process') }
            foreach ($log in @($installLog, $uninstallLog)) { if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 60 | Write-Host } }
          }
      - name: Upload desktop packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guerrilla-worker-${{ runner.os }}-${{ runner.arch }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
# Desktop engine binaries are owner-installed. This desktop/check workflow neither
# builds LichtFeld nor downloads Spirula, and publishes no releases or registry images.
# The separate build:docker helper bundles engines into the local Linux image.
