name: Worker release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Finish every main push, even when another push arrives during a build.
concurrency:
  group: worker-release-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  windows:
    name: Windows installer
    if: github.repository == 'pstoebenau/guerrilla-worker' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Version this push
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = $package.version.Split('.')
          $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=windows-v$version" >> $env:GITHUB_ENV
      - name: Check agent and license packaging
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $protocol = Get-Content packages/protocol/package.json -Raw | ConvertFrom-Json
          if ($protocol.license -ne 'MIT' -or !(Test-Path packages/protocol/LICENSE)) { throw 'Protocol MIT license required.' }
      - name: Build and self-test unsigned Windows installer
        run: ./scripts/build-windows.ps1 -Version $env:RELEASE_VERSION -Installer
      - name: Installer install, self-test and uninstall smoke test
        run: |
          $installer = (Get-ChildItem dist/installer/*.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'Guerrilla Installer Test'
          $install = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"" -Wait -PassThru
          if ($install.ExitCode) { throw 'Installer smoke test failed.' }
          $test = Start-Process (Join-Path $target 'guerrilla-worker.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode) { throw 'Installed application self-test failed.' }
          $remove = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($remove.ExitCode) { throw 'Uninstaller smoke test failed.' }
      - name: Include matching source, build identity and checksums
        run: |
          python scripts/release.py dist/installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @{ version = $env:RELEASE_VERSION; commit = $env:GITHUB_SHA; node = '22.22.0'; dotnet = '8.0.31'; signed = $false } |
            ConvertTo-Json | Set-Content dist/installer/build-info.json -Encoding utf8
          Get-ChildItem dist/installer -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content dist/installer/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub Release for this main push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; preserving its original assets.'; exit 0 }
          @"
          Windows x64 tray worker, built from $env:GITHUB_SHA.

          Download the setup.exe asset, install, and enroll from the tray app.
          Uses your installed Python, FFmpeg, NVIDIA driver, engines and plugins.
          Server defaults to https://guerrilla.dad and is configurable.
          Startup at sign-in is enabled by default and can be disabled in Settings.
          This installer is unsigned. Updates are manual downloads.

          Agent checks, application self-tests, and installer smoke tests passed.
          CI has no NVIDIA GPU; it does not claim a new GPU scan acceptance run.
          Matching source, build identity and SHA-256 checksums are attached.
          "@ | Set-Content "$env:RUNNER_TEMP/windows-release-notes.md" -Encoding utf8
          $assets = (Get-ChildItem dist/installer -File).FullName
          gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "Guerrilla Worker $env:RELEASE_VERSION (Windows)" --notes-file "$env:RUNNER_TEMP/windows-release-notes.md" @assets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  linux-checks:
    name: Linux source and CPU checks
    if: github.repository == 'pstoebenau/guerrilla-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Verify source and CPU pipeline
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test tests
          bun run build
          python -m unittest discover -s tests -p 'test_*.py'
          docker build --target test -t worker-cpu-test .
          npm ci --prefix pipeline/docker/converter
          PYTHONPATH=pipeline python -m unittest discover -s pipeline/tests -p 'test_converter.py'
      - name: Report disk usage
        if: always()
        run: |
          df -h / /mnt
          df -i /
          docker system df

  engine:
    name: Reuse or build checksummed LichtFeld artifact
    needs: linux-checks
    if: github.repository == 'pstoebenau/guerrilla-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.resolved.outputs.release_tag }}
      sha256: ${{ steps.resolved.outputs.sha256 }}
      checksums_sha256: ${{ steps.resolved.outputs.checksums_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identify engine recipe and check published archive
        id: recipe
        run: |
          recipe=$(sha256sum Dockerfile.engine scripts/build_source_bundle.py scripts/package_engine_artifact.py scripts/check_cpu_baseline.py patches/lichtfeld-cpu-baseline.patch | sha256sum | cut -d ' ' -f 1)
          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"
          python3 scripts/engine_release.py resolve --recipe "$recipe" --destination "$RUNNER_TEMP/engine-resolved"
      - name: Make room for engine compilation
        if: steps.recipe.outputs.exists != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/lib/julia /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force
          df -h /
      - name: Export executable archive and matching source evidence
        if: steps.recipe.outputs.exists != 'true'
        env:
          ENGINE_RECIPE: ${{ steps.recipe.outputs.recipe }}
        run: |
          docker buildx create --name engine-builder --driver docker-container --use
          docker buildx build --file Dockerfile.engine --target engine-artifact \
            --build-arg "ENGINE_RECIPE=$ENGINE_RECIPE" --platform linux/amd64 --progress=plain \
            --output "type=local,dest=$RUNNER_TEMP/engine-artifact" .
          python3 scripts/package_engine_artifact.py verify "$RUNNER_TEMP/engine-artifact"
          python3 scripts/engine_release.py publish --recipe "$ENGINE_RECIPE" \
            --directory "$RUNNER_TEMP/engine-artifact" --commit "$GITHUB_SHA" \
            --destination "$RUNNER_TEMP/engine-resolved"
      - name: Resolve published artifact identity
        id: resolved
        env:
          ENGINE_RECIPE: ${{ steps.recipe.outputs.recipe }}
        run: python3 scripts/engine_release.py resolve --recipe "$ENGINE_RECIPE" --destination "$RUNNER_TEMP/engine-resolved"
      - name: Report engine disk usage
        if: always()
        run: |
          df -h /
          df -i /
          docker system df
          docker buildx du --builder engine-builder || true

  runtime:
    name: Reuse or assemble Linux engine runtimes
    needs: [linux-checks, engine]
    if: github.repository == 'pstoebenau/guerrilla-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.runtime.outputs.image }}
    env:
      ENGINE_RELEASE_TAG: ${{ needs.engine.outputs.release_tag }}
      LICHTFELD_SHA256: ${{ needs.engine.outputs.sha256 }}
      ENGINE_CHECKSUMS_SHA256: ${{ needs.engine.outputs.checksums_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Log in to registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Identify runtime recipe and check published artifact
        id: recipe
        run: |
          recipe=$({ sha256sum Dockerfile.runtime pipeline/docker/requirements.txt pipeline/docker/worker-requirements.txt pipeline/docker/converter/package.json pipeline/docker/converter/package-lock.json; printf '%s\n' "$LICHTFELD_SHA256"; } | sha256sum | cut -d ' ' -f 1)
          tag="ghcr.io/pstoebenau/guerrilla-worker-runtime:recipe-$recipe"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' > "$RUNNER_TEMP/runtime-manifest.json"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Make room for runtime dependencies
        if: steps.recipe.outputs.exists != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/lib/julia /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force
          df -h /
      - name: Assemble runtime once with independent engine caches
        if: steps.recipe.outputs.exists != 'true'
        env:
          RUNTIME_TAG: ${{ steps.recipe.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ENGINE_RELEASE_TAG" --dir "$RUNNER_TEMP/engine-artifact" \
            --pattern lichtfeld-linux-amd64.tar.gz --pattern SHA256SUMS.txt
          python3 scripts/package_engine_artifact.py verify "$RUNNER_TEMP/engine-artifact" \
            --checksums-sha256 "$ENGINE_CHECKSUMS_SHA256" --asset lichtfeld-linux-amd64.tar.gz
          docker buildx create --name runtime-builder --driver docker-container --use
          docker buildx build --file Dockerfile.runtime --target combined-runtime \
            --build-context "lichtfeld-artifact=$RUNNER_TEMP/engine-artifact" \
            --build-arg "LICHTFELD_SHA256=$LICHTFELD_SHA256" --platform linux/amd64 \
            --progress=plain --provenance=mode=max --sbom=true \
            --cache-from type=registry,ref=ghcr.io/pstoebenau/guerrilla-worker-runtime:buildcache \
            --cache-to type=registry,ref=ghcr.io/pstoebenau/guerrilla-worker-runtime:buildcache,mode=max \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$RUNTIME_TAG" --push .
          docker buildx imagetools inspect "$RUNTIME_TAG" --format '{{json .Manifest}}' > "$RUNNER_TEMP/runtime-manifest.json"
      - name: Pin runtime by immutable digest
        id: runtime
        run: |
          digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/runtime-manifest.json")
          echo "image=ghcr.io/pstoebenau/guerrilla-worker-runtime@$digest" >> "$GITHUB_OUTPUT"
      - name: Report runtime disk usage
        if: always()
        run: |
          df -h /
          docker system df
          docker buildx du --builder runtime-builder || true
      - name: Logout registry
        if: always()
        run: docker logout ghcr.io

  linux:
    name: Linux image
    needs: [linux-checks, engine, runtime]
    env:
      ENGINE_RELEASE_TAG: ${{ needs.engine.outputs.release_tag }}
      LICHTFELD_SHA256: ${{ needs.engine.outputs.sha256 }}
      ENGINE_CHECKSUMS_SHA256: ${{ needs.engine.outputs.checksums_sha256 }}
      WORKER_RUNTIME_IMAGE: ${{ needs.runtime.outputs.image }}
    if: github.repository == 'pstoebenau/guerrilla-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Make room for prebuilt runtime layers
        run: |
          df -h / /mnt
          # This disposable hosted runner builds CUDA inside Docker. Keep the
          # host tool cache for setup-python, and keep Docker and GitHub CLI.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/lib/julia /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune --all --force
          df -h / /mnt
          df -i /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Version this push and check release notices
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          package_version = json.loads(pathlib.Path('package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', package_version)
          version = '.'.join(package_version.split('.')[:2]) + '.' + os.environ['GITHUB_RUN_NUMBER']
          assert pathlib.Path('LICENSE').is_file() and pathlib.Path('LICENSE').stat().st_size > 100
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VERSION=' + version + '\n')
              stream.write('RELEASE_TAG=linux-v' + version + '\n')
          PY
          if [ ! -f legal/manifest.json ]; then
            echo '::error::Linux publication requires legal/manifest.json with checksummed third-party notices.'
            exit 1
          fi
          python scripts/package_notices.py . "$RUNNER_TEMP/worker-notices" --require-license
      - name: Preserve an already published release on rerun
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare source and protocol archives
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py "$RUNNER_TEMP/worker-release"
          printf '%s\n' "$WORKER_RUNTIME_IMAGE" > "$RUNNER_TEMP/worker-release/runtime-image.txt"
          gh release download "$ENGINE_RELEASE_TAG" --dir "$RUNNER_TEMP/engine-evidence" \
            --pattern SHA256SUMS.txt --pattern engine-artifact.json \
            --pattern '*inventory.json' --pattern '*.part*'
          python - <<'PY'
          import json, os, pathlib, shutil, sys
          sys.path.insert(0, 'scripts')
          from package_engine_artifact import ARCHIVE, CHECKSUMS, verify
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'engine-evidence'
          records = verify(source, os.environ['ENGINE_CHECKSUMS_SHA256'],
                           [p.name for p in source.iterdir() if p.name != CHECKSUMS])
          if set(records) - {ARCHIVE} != {p.name for p in source.iterdir() if p.name != CHECKSUMS}:
              raise ValueError('Matching engine source evidence is incomplete')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'worker-release'
          for path in source.iterdir():
              name = 'engine-SHA256SUMS.txt' if path.name == CHECKSUMS else path.name
              shutil.copyfile(path, destination / name)
          identity = {'releaseTag': os.environ['ENGINE_RELEASE_TAG'],
                      'releaseUrl': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tag/' + os.environ['ENGINE_RELEASE_TAG'],
                      'sha256': os.environ['LICHTFELD_SHA256'],
                      'checksumsSha256': os.environ['ENGINE_CHECKSUMS_SHA256']}
          (destination / 'engine-artifact-reference.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
          python scripts/source_bundle.py "$RUNNER_TEMP/worker-release"
          cd packages/protocol
          bun pm pack --destination "$RUNNER_TEMP/worker-release"
      - name: Set up release builder
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name reviewed-release --driver docker-container --use
      - name: Report disk usage before image build
        if: steps.existing.outputs.published != 'true'
        run: |
          df -h / /mnt
          df -i /
          docker system df
          du -sh "$RUNNER_TEMP/worker-release"
      - name: Build and export release evidence
        if: steps.existing.outputs.published != 'true'
        run: docker buildx build --progress=plain --target release-evidence --build-arg "WORKER_RUNTIME_IMAGE=$WORKER_RUNTIME_IMAGE" --build-arg REQUIRE_RELEASE_LICENSE=1 --platform linux/amd64 --cache-from type=registry,ref=ghcr.io/pstoebenau/guerrilla-worker:buildcache --output "type=local,dest=$RUNNER_TEMP/worker-release" .
      - name: Report disk usage after evidence build
        if: always() && steps.existing.outputs.published != 'true'
        run: |
          df -h / /mnt
          df -i /
          docker system df
          docker buildx du --builder reviewed-release || true
          du -sh "$RUNNER_TEMP/worker-release" || true
      # Reuse the worker layers used to inventory this release.
      - name: Publish reviewed image with SBOM and provenance
        if: steps.existing.outputs.published != 'true'
        run: docker buildx build --progress=plain --target worker --build-arg "WORKER_RUNTIME_IMAGE=$WORKER_RUNTIME_IMAGE" --build-arg REQUIRE_RELEASE_LICENSE=1 --platform linux/amd64 --cache-from type=registry,ref=ghcr.io/pstoebenau/guerrilla-worker:buildcache --cache-to type=registry,ref=ghcr.io/pstoebenau/guerrilla-worker:buildcache,mode=max --provenance=mode=max --sbom=true --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$VERSION" --metadata-file "$RUNNER_TEMP/worker-release/build-metadata.json" --tag "ghcr.io/pstoebenau/guerrilla-worker:$VERSION" --push .
      - name: Publish source and compatibility evidence
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/linux-release-notes.md" <<EOF
          Linux amd64 worker image built from $GITHUB_SHA.

          Image: ghcr.io/pstoebenau/guerrilla-worker:$VERSION

          Source and CPU checks passed. CI does not claim GPU scan acceptance.
          Worker/protocol archives, pinned upstream source snapshots (including
          submodules), and registry build metadata are attached.
          Binary notices and dependency sources collected from this build are attached.
          Concatenate lichtfeld-build-dependencies.tar.gz.part* in filename order
          before extracting; build-source-inventory.json contains their checksums.
          The image includes SBOM and provenance attestations.
          EOF
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --latest=false --title "Guerrilla Worker $VERSION (Linux)" --notes-file "$RUNNER_TEMP/linux-release-notes.md" "$RUNNER_TEMP/worker-release/"*
      - name: Report final disk usage
        if: always()
        run: |
          df -h / /mnt
          df -i /
          docker system df
          docker buildx du --builder reviewed-release || true
      - name: Logout registry
        if: always()
        run: docker logout ghcr.io
