name: Build and release worker
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      linux_image_runner:
        description: Linux amd64 Docker runner label (at least 40 GiB free)
        type: string
        default: ubuntu-24.04
      linux_package_runner:
        description: Linux package runner label (use a larger or dedicated self-hosted runner with 40 GiB free)
        type: string
        default: ubuntu-24.04
      windows_package_runner:
        description: Windows package runner label (use a larger or dedicated self-hosted runner with 40 GiB free)
        type: string
        default: windows-2022
      macos_package_runner:
        description: Apple Silicon macOS package runner label (at least 12 GiB free)
        type: string
        default: macos-15
      macos_intel_package_runner:
        description: Intel macOS package runner label (at least 12 GiB free)
        type: string
        default: macos-15-intel
permissions:
  contents: read
concurrency:
  group: worker-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    name: Select shared release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select next stable version for this commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_version.py select
  packages:
    if: github.ref == 'refs/heads/main'
    needs: prepare
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux x64, Windows x64, macOS Apple Silicon, macOS Intel]
    runs-on: >-
      ${{ matrix.platform == 'Windows x64' && (inputs.windows_package_runner || 'windows-2022') ||
          matrix.platform == 'Linux x64' && (inputs.linux_package_runner || 'ubuntu-24.04') ||
          matrix.platform == 'macOS Intel' && (inputs.macos_intel_package_runner || 'macos-15-intel') ||
          inputs.macos_package_runner || 'macos-15' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the shared release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release_version.py apply --version "$RELEASE_VERSION"
      - name: Free Linux runner space for setup verification
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          # Dedicated hosted runner only. None of these tools participates in
          # the Rust/Svelte/Python worker build; keep language/build toolchains.
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /opt/ghc /usr/local/.ghcup; do
            if [ -d "$directory" ]; then sudo rm -rf -- "$directory"; fi
          done
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Require capacity for app bundles and runtime setup verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $minimumGiB = if ($env:RUNNER_OS -eq 'macOS') { 12 } else { 40 }
          $minimumBytes = $minimumGiB * 1GB
          $volumes = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) | ForEach-Object { [IO.Path]::GetPathRoot($_) } | Sort-Object -Unique
          foreach ($volume in $volumes) {
            $drive = [IO.DriveInfo]::new($volume)
            if ($drive.AvailableFreeSpace -lt $minimumBytes) {
              $available = [Math]::Round($drive.AvailableFreeSpace / 1GB, 1)
              throw "$($env:RUNNER_OS) packaging and runtime setup verification requires at least $minimumGiB GiB free on $volume; only $available GiB is available. Use a larger GitHub runner or a dedicated self-hosted runner with a larger disk."
            }
          }
          $runtimeCache = Join-Path $env:RUNNER_TEMP 'guerrilla-build-cache'
          [IO.File]::AppendAllText($env:GITHUB_ENV, "WORKER_BUILD_CACHE=$runtimeCache`n", [Text.UTF8Encoding]::new($false))
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 rpm librdmacm1
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Build desktop with vendored dependencies
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run check:python
          bun run build --verbose
      - name: Test the built worker, desktop and packaged integrations
        run: |
          bun test tests
          cargo test --release --locked --workspace
          cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --target-dir desktop/src-tauri/target --features tauri/custom-protocol
          python -m unittest discover -s tests -p 'test_*.py'
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          root = Path.cwd()
          runtime = root / 'desktop/src-tauri/resources/runtime'
          windows = os.name == 'nt'
          executable = runtime / 'python' / ('python.exe' if windows else 'bin/python3')
          environment = os.environ.copy()
          environment.pop('PYTHONHOME', None)
          environment['PYTHONPATH'] = str(root / 'pipeline')
          environment['NODE_BIN'] = str(runtime / 'node' / ('node.exe' if windows else 'bin/node'))
          environment['SPLAT_TRANSFORM_BIN'] = str(runtime / 'converter/node_modules/@playcanvas/splat-transform/bin/cli.mjs')
          environment['PATH'] = os.pathsep.join([str(Path(environment['NODE_BIN']).parent), str(runtime / 'ffmpeg'), environment.get('PATH', '')])
          subprocess.run([str(executable), '-m', 'unittest', 'discover', '-s', 'pipeline/tests'], env=environment, check=True)
          subprocess.run([str(executable), '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_runtime_setup.py'], env=environment, check=True)
          PYTHON
      - name: Verify optional GPU runtime setup and offline reuse
        if: runner.os != 'macOS'
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          root = Path.cwd()
          profile = Path(os.environ['RUNNER_TEMP']) / 'gpu-setup-profile/config.json'
          environment = os.environ.copy()
          environment['WORKER_RUNTIME_ROOT'] = str(root / 'desktop/src-tauri/resources/runtime')
          worker = root / 'target/release' / ('guerrilla-worker.exe' if os.name == 'nt' else 'guerrilla-worker')
          command = [str(worker), '--config', str(profile), 'setup-runtime']
          subprocess.run(command, env=environment, check=True)
          # Completed, verified setup must reuse the same runtime without downloading.
          environment['HTTPS_PROXY'] = 'http://127.0.0.1:1'
          environment['HTTP_PROXY'] = 'http://127.0.0.1:1'
          output = subprocess.check_output(command, env=environment, text=True)
          result = json.loads(output.splitlines()[-1])
          assert result['installed'] is True
          assert 'Downloading' not in output
          # Exercise the relocated GPU Python and actual bindings, while the
          # desktop continues to ship only its base runtime.
          runtime = Path(result['directory'])
          python = runtime / 'python' / ('python.exe' if os.name == 'nt' else 'bin/python3')
          environment.pop('HTTPS_PROXY', None)
          environment.pop('HTTP_PROXY', None)
          environment['PYTHONPATH'] = str(root / 'pipeline')
          base = root / 'desktop/src-tauri/resources/runtime'
          environment['NODE_BIN'] = str(base / 'node' / ('node.exe' if os.name == 'nt' else 'bin/node'))
          environment['SPLAT_TRANSFORM_BIN'] = str(base / 'converter/node_modules/@playcanvas/splat-transform/bin/cli.mjs')
          subprocess.run([str(python), '-m', 'unittest', 'discover', '-s', 'pipeline/tests'], env=environment, check=True)
          assert not profile.exists()
          assert not profile.with_name('credentials.json').exists()
          assert not profile.parent.joinpath('scratch').exists()
          PYTHON
      - name: Smoke test Windows installer without enrollment or worker launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This production installer test is runner-only. Fail closed if the
          # account has an existing worker/profile/login entry; /DIR alone does
          # not isolate the installer's normal profile and registry cleanup.
          $normalProfile = Join-Path $env:LOCALAPPDATA 'Guerrilla/worker'
          function Assert-FreshWorkerAccount {
            if (Test-Path -LiteralPath $normalProfile) { throw 'Installer smoke requires a fresh dedicated runner without a normal worker profile.' }
            if (@(Get-Process -Name 'guerrilla-worker-desktop', 'guerrilla-worker', 'guerrilla-pipeline' -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Existing worker processes prevent an isolated installer smoke test.' }
            $runKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Microsoft\Windows\CurrentVersion\Run')
            try {
              if ($null -ne $runKey) {
                foreach ($entry in @('GuerrillaWorker', 'guerrilla-worker-desktop')) {
                  if ($runKey.GetValueNames() -contains $entry) { throw 'Existing Guerrilla login registration prevents installer smoke testing.' }
                }
              }
            } finally { if ($null -ne $runKey) { $runKey.Dispose() } }
          }
          Assert-FreshWorkerAccount
          $installerFolder = Join-Path $env:GITHUB_WORKSPACE 'desktop/src-tauri/target/release/bundle/installer'
          $installers = @(Get-ChildItem -LiteralPath $installerFolder -Filter '*-windows-x64-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one generated Windows installer.' }
          $installer = $installers[0]
          if (@(Get-ChildItem -LiteralPath $installerFolder -Filter ($installer.BaseName + '-*.bin') -File).Count -ne 0) { throw 'Expected a single-file installer without data slices.' }
          $qaRoot = Join-Path $env:RUNNER_TEMP ('guerrilla-installer-' + [Guid]::NewGuid().ToString('N'))
          $installed = Join-Path $qaRoot 'app'
          $profileDirectory = Join-Path $qaRoot 'profile'
          $null = New-Item -ItemType Directory -Path $profileDirectory -Force
          $config = Join-Path $profileDirectory 'config.json'
          $scratch = Join-Path $profileDirectory 'scratch'
          $null = New-Item -ItemType Directory -Path $scratch -Force
          $sentinel = Join-Path $scratch 'retained-checkpoint.txt'
          [IO.File]::WriteAllText($sentinel, 'preserved-checkpoint', [Text.UTF8Encoding]::new($false))
          $installLog = Join-Path $qaRoot 'install.log'
          $uninstallLog = Join-Path $qaRoot 'uninstall.log'
          $trackedEnvironment = @('WORKER_CREDENTIAL_FILE', 'WORKER_PIPELINE_BIN', 'WORKER_RUNTIME_ROOT', 'WORKER_CRT_ROOT', 'PIPELINE_ROOT', 'WORKER_SCRATCH', 'LICHTFELD_BIN', 'SPIRULA_BIN')
          $previousEnvironment = @{}
          foreach ($name in $trackedEnvironment) { $previousEnvironment[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }
          $uninstaller = Join-Path $installed 'unins000.exe'
          $removed = $false
          try {
            $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installed`"", "/LOG=`"$installLog`"") -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "Installer failed ($($setup.ExitCode)); inspect $installLog" }
            # Reinstall must remove obsolete app-owned GPU files, rather than
            # mixing the base runtime with dependencies from older releases.
            $obsolete = Join-Path $installed 'resources/runtime/python/obsolete-gpu-runtime.fixture'
            [IO.File]::WriteAllText($obsolete, 'obsolete app-owned dependency')
            $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installed`"", "/LOG=`"$installLog`"") -Wait -PassThru
            if ($upgrade.ExitCode -ne 0 -or (Test-Path -LiteralPath $obsolete)) { throw 'Upgrade failed to replace the app-owned runtime cleanly.' }
            $requiredFiles = @(
              'guerrilla-worker-desktop.exe', 'guerrilla-worker.exe', 'guerrilla-pipeline.exe',
              'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'LICENSE', 'README.md',
              'resources/runtime/manifest.json', 'resources/runtime/windows-crt/manifest.json',
              'resources/runtime/setup/manifest.json', 'resources/runtime/setup/runtime_setup.py',
              'resources/runtime/python/python.exe', 'resources/runtime/node/node.exe',
              'resources/runtime/ffmpeg/ffmpeg.exe', 'resources/runtime/ffmpeg/ffprobe.exe',
              'resources/runtime/converter/node_modules/@playcanvas/splat-transform/bin/cli.mjs',
              'resources/pipeline/native_bindings.py', 'resources/pipeline/scan-settings.schema.json'
            )
            foreach ($relative in $requiredFiles) {
              if (!(Test-Path -LiteralPath (Join-Path $installed $relative) -PathType Leaf)) { throw "Installed app is missing $relative" }
            }
            $runtime = Join-Path $installed 'resources/runtime'
            $pipeline = Join-Path $installed 'resources/pipeline'
            $profile = [ordered]@{
              controlUrl = 'https://example.invalid'; scratchDirectory = $scratch;
              pythonPath = (Join-Path $runtime 'python/python.exe'); nodePath = (Join-Path $runtime 'node/node.exe');
              ffmpegPath = (Join-Path $runtime 'ffmpeg/ffmpeg.exe');
              converterPath = (Join-Path $runtime 'converter/node_modules/@playcanvas/splat-transform/bin/cli.mjs');
              lichtfeldPath = (Join-Path $qaRoot 'not-installed/lichtfeld.exe');
              spirulaPath = (Join-Path $qaRoot 'not-installed/spirula.exe');
              densificationPluginPath = ''; startAtLogin = $false
            }
            [IO.File]::WriteAllText($config, ($profile | ConvertTo-Json -Depth 4), [Text.UTF8Encoding]::new($false))
            $configHash = (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash
            $env:WORKER_CREDENTIAL_FILE = Join-Path $profileDirectory 'credentials.json'
            $env:WORKER_PIPELINE_BIN = Join-Path $installed 'guerrilla-pipeline.exe'
            $env:WORKER_RUNTIME_ROOT = $runtime
            $env:WORKER_CRT_ROOT = Join-Path $runtime 'windows-crt'
            $env:PIPELINE_ROOT = $pipeline
            $env:WORKER_SCRATCH = $scratch
            $env:LICHTFELD_BIN = $profile.lichtfeldPath
            $env:SPIRULA_BIN = $profile.spirulaPath
            $worker = Join-Path $installed 'guerrilla-worker.exe'
            $statusOutput = & $worker --config $config status
            if ($LASTEXITCODE -ne 0) { throw 'Installed worker status command failed.' }
            $status = ($statusOutput -join "`n") | ConvertFrom-Json
            if ($status.state -ne 'unenrolled' -or $status.connected -or $status.running) { throw 'Fresh installed worker must be unenrolled, disconnected and stopped.' }
            $preflightOutput = & $worker --config $config preflight
            if ($LASTEXITCODE -ne 0) { throw 'Installed pipeline dependency report failed.' }
            $preflight = ($preflightOutput -join "`n") | ConvertFrom-Json
            foreach ($backend in @('lichtfeld', 'spirula')) {
              $capability = $preflight.backends.PSObject.Properties[$backend]
              if ($null -eq $capability -or $capability.Value.available) { throw 'Missing user-installed engines must remain unavailable.' }
            }
            if (Test-Path -LiteralPath $env:WORKER_CREDENTIAL_FILE) { throw 'Status/preflight unexpectedly created enrollment.' }
            Assert-FreshWorkerAccount
            $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$uninstallLog`"") -Wait -PassThru
            if ($remove.ExitCode -ne 0) { throw "Uninstall failed ($($remove.ExitCode)); inspect $uninstallLog" }
            $removed = $true
            # The uninstaller deletes its own executable through a short-lived
            # helper; allow it to finish before checking the removed files.
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            while ((Test-Path -LiteralPath (Join-Path $installed 'guerrilla-worker-desktop.exe')) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 250 }
            foreach ($relative in $requiredFiles) {
              if (Test-Path -LiteralPath (Join-Path $installed $relative)) { throw "Uninstall retained owned app file $relative" }
            }
            if (!(Test-Path -LiteralPath $config) -or (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash -ne $configHash) { throw 'Uninstall changed the isolated worker profile.' }
            if (!(Test-Path -LiteralPath $sentinel) -or [IO.File]::ReadAllText($sentinel) -ne 'preserved-checkpoint') { throw 'Uninstall removed the retained checkpoint.' }
            Assert-FreshWorkerAccount
          } finally {
            if (!$removed -and (Test-Path -LiteralPath $uninstaller)) {
              $cleanup = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$uninstallLog`"") -Wait -PassThru
              if ($cleanup.ExitCode -ne 0) { Write-Warning "Installer smoke cleanup failed ($($cleanup.ExitCode))." }
            }
            foreach ($name in $trackedEnvironment) { [Environment]::SetEnvironmentVariable($name, $previousEnvironment[$name], 'Process') }
            foreach ($log in @($installLog, $uninstallLog)) { if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 60 | Write-Host } }
          }
      - name: Prepare complete release assets and checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        run: python scripts/release_assets.py --bundle desktop/src-tauri/target/release/bundle --destination "$RUNNER_TEMP/release-assets" --platform "$RELEASE_PLATFORM" --version "$RELEASE_VERSION"
      - name: Upload desktop packages for the combined release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guerrilla-worker-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  docker:
    name: Build and publish matching Linux image
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.linux_image_runner || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Free hosted runner space
        if: runner.environment == 'github-hosted'
        run: |
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /opt/ghc /usr/local/.ghcup; do
            if [ -d "$directory" ]; then sudo rm -rf -- "$directory"; fi
          done
      - name: Require Docker build capacity
        run: |
          available=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1)
          if [ "$available" -lt 42949672960 ]; then
            echo 'Linux image builds require at least 40 GiB free. Select a larger linux_image_runner.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Refuse conflicting releases and reuse existing release images
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_version.py existing --version "$RELEASE_VERSION"
      - name: Apply the same version used by desktop packages
        if: steps.existing.outputs.exists != 'true'
        run: |
          python scripts/release_version.py apply --version "$RELEASE_VERSION"
          bun install --frozen-lockfile
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the self-contained Linux image
        id: image
        env:
          WORKER_BUILD_CACHE: ${{ runner.temp }}/guerrilla-build-cache
          EXISTING_RELEASE: ${{ steps.existing.outputs.exists }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$EXISTING_RELEASE" = true ]; then
            digest=$(docker buildx imagetools inspect "$image:$RELEASE_TAG" --format '{{.Manifest.Digest}}')
            jq -n --arg digest "$digest" '{"containerimage.digest":$digest}' > "$RUNNER_TEMP/worker-image.json"
          else
            bun run build:docker --push \
              --runtime-image "$image-runtime:$RELEASE_TAG" \
              --worker-image "$image:$RELEASE_TAG" \
              --metadata-file "$RUNNER_TEMP/worker-image.json"
          fi
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/worker-image.json")
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
      - name: Save image digest and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-image-metadata
          path: ${{ runner.temp }}/worker-image.json
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish matching desktop and Linux image release
    needs: [prepare, packages, docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download all four native package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: guerrilla-worker-*
          path: dist/release-artifacts
      - name: Verify every platform, upload all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_IMAGE: ${{ needs.docker.outputs.image }}
        run: python scripts/publish_release.py --artifacts dist/release-artifacts --destination dist/release --version "$RELEASE_VERSION" --image "$RELEASE_IMAGE"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Point the latest image at the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          # An older failed run may be retried after a newer release succeeds.
          # It must never move the rolling image tag back to that older release.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" != "$RELEASE_TAG" ]; then exit 0; fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$RELEASE_IMAGE"
# Desktop engines remain owner-installed. The matching Linux image bundles them.
