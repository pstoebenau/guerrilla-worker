name: Build and release worker
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      linux_image_runner:
        description: Linux amd64 Docker runner label (at least 40 GiB free)
        type: string
        default: ubuntu-24.04
      linux_package_runner:
        description: Linux package runner label (use a larger or dedicated self-hosted runner with 40 GiB free)
        type: string
        default: ubuntu-24.04
      windows_package_runner:
        description: Windows package runner label (use a larger or dedicated self-hosted runner with 40 GiB free)
        type: string
        default: windows-2022
      macos_package_runner:
        description: Apple Silicon macOS package runner label (at least 12 GiB free)
        type: string
        default: macos-15
permissions:
  contents: read
concurrency:
  group: worker-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Select shared build version
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: github.ref == 'refs/heads/main'
      - name: Log in to GHCR for version allocation
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Select the version for this build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            python scripts/release_version.py select --check-images
          else
            python - <<'PYTHON'
          import os
          from pathlib import Path
          from scripts.release_version import check_versions
          version = check_versions(Path.cwd())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\ntag=v{version}\n')
          PYTHON
          fi
  packages:
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
    needs: prepare
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux x64, Windows x64, macOS Apple Silicon]
    runs-on: >-
      ${{ matrix.platform == 'Windows x64' && (inputs.windows_package_runner || 'windows-2022') ||
          matrix.platform == 'Linux x64' && (inputs.linux_package_runner || 'ubuntu-24.04') ||
          inputs.macos_package_runner || 'macos-15' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply the shared release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release_version.py apply --version "$RELEASE_VERSION"
      - name: Free Linux runner space for setup verification
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          # Dedicated hosted runner only. None of these tools participates in
          # the Rust/Svelte/Python worker build; keep language/build toolchains.
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /opt/ghc /usr/local/.ghcup; do
            if [ -d "$directory" ]; then sudo rm -rf -- "$directory"; fi
          done
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Require capacity for app bundles and runtime setup verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $minimumGiB = if ($env:RUNNER_OS -eq 'macOS') { 12 } else { 40 }
          $minimumBytes = $minimumGiB * 1GB
          $volumes = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) | ForEach-Object { [IO.Path]::GetPathRoot($_) } | Sort-Object -Unique
          foreach ($volume in $volumes) {
            $drive = [IO.DriveInfo]::new($volume)
            if ($drive.AvailableFreeSpace -lt $minimumBytes) {
              $available = [Math]::Round($drive.AvailableFreeSpace / 1GB, 1)
              throw "$($env:RUNNER_OS) packaging and runtime setup verification requires at least $minimumGiB GiB free on $volume; only $available GiB is available. Use a larger GitHub runner or a dedicated self-hosted runner with a larger disk."
            }
          }
          $runtimeCache = Join-Path $env:RUNNER_TEMP 'guerrilla-build-cache'
          [IO.File]::AppendAllText($env:GITHUB_ENV, "WORKER_BUILD_CACHE=$runtimeCache`n", [Text.UTF8Encoding]::new($false))
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 rpm cpio librdmacm1 minisign
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Prepare updater signing (ephemeral keys for pull requests)
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd desktop
          python scripts/configure_updater.py
      - name: Build desktop with vendored dependencies
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build --verbose
      - name: Stage Windows app-local CRT beside desktop Rust tests
        if: runner.os == 'Windows'
        run: |
          python - <<'PYTHON'
          import hashlib, json, re, shutil
          from pathlib import Path
          root = Path.cwd()
          source = root / 'desktop/src-tauri/resources/runtime/windows-crt'
          destination = root / 'desktop/src-tauri/target/release/deps'
          manifest = json.loads((source / 'manifest.json').read_text())
          if manifest['schemaVersion'] != 1 or manifest['architecture'] != 'x64':
              raise ValueError('Expected the packaged x64 Microsoft CRT manifest')
          files = manifest['files']
          names = {record['fileName'].lower() for record in files}
          if not {'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll'} <= names:
              raise ValueError('Packaged Microsoft CRT dependencies are incomplete')
          for record in files:
              name = record['fileName']
              if not re.fullmatch(r'(?:msvcp140(?:_[a-z0-9_]+)?|vcruntime140(?:_[a-z0-9_]+)?|concrt140|vcomp140)\.dll', name, re.I):
                  raise ValueError(f'Unexpected Microsoft CRT filename: {name}')
              if hashlib.sha256((source / name).read_bytes()).hexdigest() != record['sha256']:
                  raise ValueError(f'Packaged Microsoft CRT checksum mismatch: {name}')
          destination.mkdir(parents=True, exist_ok=True)
          for record in files:
              # Windows searches the executable directory before System32 and PATH.
              # Cargo places these test executables in release/deps, not release/.
              shutil.copy2(source / record['fileName'], destination / record['fileName'])
              print(f"Desktop test app-local CRT: {record['fileName']} {record['sourceFileVersion']}")
          PYTHON
      - name: Test the built worker, desktop and packaged integrations
        run: |
          bun test tests
          cargo test --release --locked --workspace
          cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --target-dir desktop/src-tauri/target --features tauri/custom-protocol
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Diagnose Windows desktop test loader failures
        if: failure() && runner.os == 'Windows'
        run: |
          python - <<'PYTHON'
          import os, shutil, subprocess
          from pathlib import Path
          dumpbin = shutil.which('dumpbin')
          if not dumpbin:
              vswhere = Path(os.environ.get('ProgramFiles(x86)', 'C:/Program Files (x86)')) / 'Microsoft Visual Studio/Installer/vswhere.exe'
              if vswhere.is_file():
                  result = subprocess.run([str(vswhere), '-latest', '-products', '*', '-requires',
                      'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '-find',
                      r'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe'], capture_output=True, text=True, timeout=30)
                  paths = result.stdout.splitlines()
                  dumpbin = paths[-1] if result.returncode == 0 and paths else None
          if not dumpbin:
              print('DUMPBIN unavailable; inspect the logged app-local CRT versions and Windows loader exit code.')
          else:
              executables = sorted(Path('desktop/src-tauri/target/release/deps').glob('guerrilla_worker_desktop-*.exe'))
              for executable in executables:
                  print(f'Desktop test loader imports: {executable}', flush=True)
                  for option in ['/dependents', '/imports:msvcp140.dll', '/imports:vcruntime140.dll', '/imports:vcruntime140_1.dll']:
                      subprocess.run([dumpbin, option, str(executable)], check=False, timeout=30)
          PYTHON
      - name: Verify signed macOS updater installation and rejection recovery
        if: runner.os == 'macOS'
        run: |
          python - <<'PYTHON'
          import json, os, subprocess, tempfile
          from pathlib import Path
          root = Path.cwd()
          config = json.loads((root / 'desktop/src-tauri/tauri.conf.json').read_text())
          archives = list((root / 'desktop/src-tauri/target/release/bundle/macos').glob('*.app.tar.gz'))
          if len(archives) != 1:
              raise ValueError('Expected exactly one signed Tauri macOS updater archive')
          package = archives[0].resolve()
          signature = package.with_name(package.name + '.sig')
          if not signature.is_file():
              raise ValueError('The built macOS updater signature is missing')
          with tempfile.TemporaryDirectory(prefix='updater-public-key-', dir=os.environ['RUNNER_TEMP']) as directory:
              public_key = Path(directory) / 'release.pub'
              public_key.write_text(os.environ.get('GUERRILLA_UPDATER_TEST_PUBKEY') or config['plugins']['updater']['pubkey'])
              environment = dict(os.environ, GUERRILLA_UPDATER_TEST_PACKAGE=str(package),
                  GUERRILLA_UPDATER_TEST_SIGNATURE=str(signature), GUERRILLA_UPDATER_TEST_PUBLIC_KEY=str(public_key),
                  GUERRILLA_UPDATER_TEST_VERSION=config['version'])
              environment.pop('GUERRILLA_UPDATER_TEST_KEEP', None)
              subprocess.run(['cargo', 'test', '--release', '--locked', '--manifest-path', 'desktop/src-tauri/Cargo.toml',
                  '--target-dir', 'desktop/src-tauri/target', '--features', 'tauri/custom-protocol',
                  'updates::lifecycle_tests::native_signed_macos_fixture_installs_and_preserves_old_app_on_rejection',
                  '--', '--ignored', '--exact'], env=environment, check=True, timeout=300)
          PYTHON
      - name: Prepare Windows Vulkan loader for runtime verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hosted runners have no GPU driver supplying the Vulkan loader.
          # Keep this test prerequisite outside the app's bundled resources.
          $archive = Join-Path $env:RUNNER_TEMP 'vulkan-runtime-components.zip'
          curl.exe --fail --location --retry 3 --max-time 120 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/VulkanRT-X64-1.4.363.0-Components.zip?Human=true' --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan runtime download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'a25a927aa8b9f0371048f1861cf88ac3b9bc9b1fb332c42d897c8ab32695769a') { throw 'Vulkan runtime checksum mismatch.' }
          $destination = Join-Path $env:RUNNER_TEMP 'vulkan-runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $loader = Join-Path $destination 'VulkanRT-X64-1.4.363.0-Components/x64'
          if (!(Test-Path -LiteralPath (Join-Path $loader 'vulkan-1.dll') -PathType Leaf)) { throw 'Vulkan runtime archive is missing the x64 loader.' }
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$loader`n", [Text.UTF8Encoding]::new($false))
      - name: Verify native runtime installation and offline reuse
        run: |
          python - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          profile = Path(os.environ['RUNNER_TEMP']) / 'native-setup-profile/config.json'
          resources = root / 'desktop/src-tauri/resources/runtime'
          environment = dict(os.environ, WORKER_RUNTIME_ROOT=str(resources))
          if os.name == 'nt':
              environment['PATH'] = os.pathsep.join([str(resources / 'windows-crt'), environment.get('PATH', '')])
          worker = root / 'target/release' / ('guerrilla-worker.exe' if os.name == 'nt' else 'guerrilla-worker')
          command = [str(worker), '--config', str(profile), 'setup-runtime']
          subprocess.run(command, env=environment, check=True, timeout=1800)
          environment.update(HTTPS_PROXY='http://127.0.0.1:1', HTTP_PROXY='http://127.0.0.1:1')
          output = subprocess.check_output(command, env=environment, text=True, timeout=1800)
          result = json.loads(output.splitlines()[-1])
          assert result['type'] == 'runtime-setup-complete'
          assert Path(result['spirulaPath']).is_file() and Path(result['modelPath']).is_file()
          assert 'Downloading' not in output
          version = subprocess.check_output([result['spirulaPath'], '--version'], env=environment, text=True, timeout=30)
          installed = json.loads((Path(result['root']) / 'manifest.json').read_text())
          assert version.split()[0] == installed['version']
          assert not profile.exists() and not profile.with_name('credentials.json').exists()
          PYTHON
      - name: Smoke test Windows installer without enrollment or worker launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1
      - name: Prepare complete release assets and checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        run: python scripts/release_assets.py --bundle desktop/src-tauri/target/release/bundle --destination "$RUNNER_TEMP/release-assets" --platform "$RELEASE_PLATFORM" --version "$RELEASE_VERSION"
      - name: Upload desktop packages for the combined release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guerrilla-worker-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
          compression-level: 0
  docker:
    name: Build and publish matching Linux image
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.linux_image_runner || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Free hosted runner space
        if: runner.environment == 'github-hosted'
        run: |
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /opt/ghc /usr/local/.ghcup; do
            if [ -d "$directory" ]; then sudo rm -rf -- "$directory"; fi
          done
      - name: Require Docker build capacity
        run: |
          available=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1)
          if [ "$available" -lt 42949672960 ]; then
            echo 'Linux image builds require at least 40 GiB free. Select a larger linux_image_runner.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Refuse conflicting releases and verify existing registry image
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_version.py existing --version "$RELEASE_VERSION"
          python scripts/release_image.py --version "$RELEASE_VERSION" --metadata-file "$RUNNER_TEMP/worker-image.json"
      - name: Apply the same version used by desktop packages
        if: steps.existing.outputs.image_exists != 'true'
        run: |
          python scripts/release_version.py apply --version "$RELEASE_VERSION"
          bun install --frozen-lockfile
      - name: Build and push the self-contained Linux image
        id: image
        env:
          WORKER_BUILD_CACHE: ${{ runner.temp }}/guerrilla-build-cache
          EXISTING_IMAGE: ${{ steps.existing.outputs.image_exists }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$EXISTING_IMAGE" != true ]; then
            bun run build:docker --push \
              --runtime-image "$image-runtime:$RELEASE_TAG" \
              --worker-image "$image:$RELEASE_TAG" \
              --metadata-file "$RUNNER_TEMP/worker-image.json"
          fi
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/worker-image.json")
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
      - name: Save image digest and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-image-metadata
          path: ${{ runner.temp }}/worker-image.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  release:
    name: Publish matching desktop and Linux image release
    needs: [prepare, packages, docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download all three native package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: guerrilla-worker-*
          path: dist/release-artifacts
      - name: Install upstream updater signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify every platform, upload all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_IMAGE: ${{ needs.docker.outputs.image }}
        run: python scripts/publish_release.py --artifacts dist/release-artifacts --destination dist/release --version "$RELEASE_VERSION" --image "$RELEASE_IMAGE"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Point the latest image at the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          # An older failed run may be retried after a newer release succeeds.
          # It must never move the rolling image tag back to that older release.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" != "$RELEASE_TAG" ]; then exit 0; fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$RELEASE_IMAGE"
