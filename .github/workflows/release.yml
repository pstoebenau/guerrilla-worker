name: Linux image release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-release-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'pstoebenau/guerrilla-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Make room for CUDA and engine build dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Version this push and check release notices
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          package_version = json.loads(pathlib.Path('package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', package_version)
          version = '.'.join(package_version.split('.')[:2]) + '.' + os.environ['GITHUB_RUN_NUMBER']
          assert pathlib.Path('LICENSE').is_file() and pathlib.Path('LICENSE').stat().st_size > 100
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VERSION=' + version + '\n')
              stream.write('RELEASE_TAG=linux-v' + version + '\n')
          PY
          if [ ! -f legal/manifest.json ]; then
            echo '::error::Linux publication requires legal/manifest.json with checksummed third-party notices.'
            exit 1
          fi
          python scripts/package_notices.py . "$RUNNER_TEMP/worker-notices" --require-license
      - name: Preserve an already published release on rerun
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify source and CPU pipeline
        if: steps.existing.outputs.published != 'true'
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test tests
          bun run build
          python -m unittest discover -s tests -p 'test_*.py'
          docker build --target test -t worker-cpu-test .
      - name: Prepare source and protocol archives
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py "$RUNNER_TEMP/worker-release"
          python scripts/source_bundle.py "$RUNNER_TEMP/worker-release"
          cd packages/protocol
          bun pm pack --destination "$RUNNER_TEMP/worker-release"
      - name: Publish reviewed image with SBOM and provenance
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name reviewed-release --driver docker-container --use
          docker buildx build --target release-evidence --build-arg REQUIRE_RELEASE_LICENSE=1 --build-arg BUILD_JOBS=2 --platform linux/amd64 --output "type=local,dest=$RUNNER_TEMP/worker-release" .
          docker buildx build --target worker --build-arg REQUIRE_RELEASE_LICENSE=1 --build-arg BUILD_JOBS=2 --platform linux/amd64 --provenance=mode=max --sbom=true --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$VERSION" --metadata-file "$RUNNER_TEMP/worker-release/build-metadata.json" --tag "ghcr.io/pstoebenau/guerrilla-worker:linux-$VERSION" --push .
      - name: Publish source and compatibility evidence
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/linux-release-notes.md" <<EOF
          Linux amd64 worker image built from $GITHUB_SHA.

          Image: ghcr.io/pstoebenau/guerrilla-worker:linux-$VERSION

          Source and CPU checks passed. CI does not claim GPU scan acceptance.
          Worker/protocol archives, pinned upstream source snapshots (including
          submodules), and registry build metadata are attached.
          Binary notices and dependency sources collected from this build are attached.
          Concatenate lichtfeld-build-dependencies.tar.gz.part* in filename order
          before extracting; build-source-inventory.json contains their checksums.
          The image includes SBOM and provenance attestations.
          EOF
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --latest=false --title "Guerrilla Worker $VERSION (Linux)" --notes-file "$RUNNER_TEMP/linux-release-notes.md" "$RUNNER_TEMP/worker-release/"*
      - name: Logout registry
        if: always()
        run: docker logout ghcr.io
