name: Reviewed worker release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'pstoebenau/guerrilla-worker' && vars.RELEASE_APPROVED == 'true'
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check accepted license and immutable version tag
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert os.environ['GITHUB_REF'] == 'refs/tags/v' + version
          assert pathlib.Path('LICENSE').is_file() and pathlib.Path('LICENSE').stat().st_size > 100
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('VERSION=' + version + '\n')
          PY
          python scripts/package_notices.py . "$RUNNER_TEMP/worker-notices" --require-license
      - name: Verify source and CPU pipeline
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test tests
          bun run build
          python -m unittest discover -s tests -p 'test_*.py'
          docker build --target test -t worker-cpu-test .
      - name: Prepare source and protocol archives
        run: |
          python scripts/release.py "$RUNNER_TEMP/worker-release"
          cd packages/protocol
          bun pm pack --destination "$RUNNER_TEMP/worker-release"
      - name: Publish reviewed image with SBOM and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name reviewed-release --driver docker-container --use
          docker buildx build --target worker --build-arg REQUIRE_RELEASE_LICENSE=1 --platform linux/amd64 --provenance=mode=max --sbom=true --metadata-file "$RUNNER_TEMP/worker-release/build-metadata.json" --tag "ghcr.io/pstoebenau/guerrilla-worker:$VERSION" --push .
      - name: Publish source and compatibility evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --verify-tag --title "Guerrilla Worker $VERSION" --notes-file "docs/release-notes-$VERSION.md" "$RUNNER_TEMP/worker-release/"*
      - name: Logout registry
        if: always()
        run: docker logout ghcr.io
