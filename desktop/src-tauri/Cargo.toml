[package]
name = "guerrilla-worker-desktop"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"

[workspace]

[lib]
name = "guerrilla_worker_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
guerrilla-runtime = { path = "../../rust/runtime" }
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
semver = "=1.0.28"
tokio = { version = "=1.48.0", features = ["process", "time", "io-util", "sync", "macros"] }
url = "=2.5.7"

